# Publishes public/ to GitHub Pages.
#
# One-time setup in the repo: Settings -> Pages -> Source: "GitHub Actions".
# Without that the workflow runs but nothing is served.

name: Deploy to GitHub Pages

on:
  push:
    # This repo's default branch is master. Both are listed so a later rename
    # to main doesn't silently stop deployments — a workflow that never
    # triggers looks identical to one that has nothing to do.
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The GPX schema tests shell out to xmllint; without it they skip
      # silently, which would defeat the point of running them in CI.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # public/ is the site root exactly as served locally — no build step,
      # so what is tested is what ships.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
